name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experimental/native-alac-linked
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run engine tests
        run: |
          npm ci
          npm test

      - name: Prepare private arm64 runtime
        run: macos/scripts/prepare-runtime.sh

      - name: Verify lossless PCM round trip
        env:
          STEM_PACKAGER_FFMPEG: macos/Runtime/macos-arm64/ffmpeg
          STEM_PACKAGER_FFPROBE: macos/Runtime/macos-arm64/ffprobe
        run: node --test test/lossless-roundtrip.test.mjs

      - name: Verify Apple AAC 320 CBR encoder
        run: |
          FFMPEG="macos/Runtime/macos-arm64/ffmpeg"
          FFPROBE="macos/Runtime/macos-arm64/ffprobe"
          "$FFMPEG" -hide_banner -loglevel error -y \
            -f lavfi -i "anullsrc=r=44100:cl=stereo" -t 2 \
            -c:a aac_at -aac_at_mode cbr -b:a 320k /tmp/aac-320-cbr.m4a
          test "$("$FFPROBE" -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/aac-320-cbr.m4a)" = "aac"

      - name: Build self-contained app
        run: macos/scripts/build-app.sh

      - name: Verify bundle and installer
        run: |
          APP="macos/build/Traktor Stem Packager.app"
          INSTALLER="macos/installer/Install Traktor Stem Packager.command"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test -x "$APP/Contents/MacOS/TraktorStemPackager"
          test -x "$APP/Contents/Resources/Runtime/node"
          test -x "$APP/Contents/Resources/Runtime/ffmpeg"
          test -x "$APP/Contents/Resources/Runtime/ffprobe"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Contents/Info.plist")" = "Traktor Stem Packager"
          test "$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")" = "AppIcon"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$PACKAGE_VERSION"
          grep -F "Text(\"v$PACKAGE_VERSION\")" macos/Sources/TraktorStemPackager/ContentView.swift
          grep -F 'Text("CHOOSE ONE OF TWO WORKFLOWS")' macos/Sources/TraktorStemPackager/ContentView.swift
          grep -F 'case .rememberLastUsed: "Remember Last Used"' macos/Sources/TraktorStemPackager/AudioRole.swift
          grep -F 'case .nativeLossless: "Lossless Traktor Installation"' macos/Sources/TraktorStemPackager/AudioRole.swift
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/TraktorStemPackager" | grep arm64
          file "$APP/Contents/Resources/Runtime/node" | grep arm64
          file "$APP/Contents/Resources/Runtime/ffmpeg" | grep arm64
          test -x "$INSTALLER"
          zsh -n "$INSTALLER"

      - name: Package application with installer
        id: package
        run: |
          DIST="Traktor Stem Packager Installer"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          ARTIFACT_NAME="Traktor-Stem-Packager-$PACKAGE_VERSION-macOS"
          mkdir -p "$DIST"
          ditto "macos/build/Traktor Stem Packager.app" "$DIST/Traktor Stem Packager.app"
          cp "macos/installer/Install Traktor Stem Packager.command" "$DIST/"
          cp "macos/installer/README.txt" "$DIST/"
          cp "macos/installer/LOSSLESS-WORKFLOW-NOTES.txt" "$DIST/"
          chmod +x "$DIST/Install Traktor Stem Packager.command"
          ditto -c -k --sequesterRsrc --keepParent "$DIST" "$ARTIFACT_NAME.zip"
          shasum -a 256 "$ARTIFACT_NAME.zip" > "$ARTIFACT_NAME.zip.sha256"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.zip
            ${{ env.ARTIFACT_NAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Compatibility — ${{ matrix.name }}
    needs: build
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26 stable
            runner: macos-26
            experimental: false
          - name: macOS 27 preview
            runner: xcode-27
            experimental: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report test system
        run: sw_vers && uname -m

      - name: Run engine tests
        run: |
          npm ci
          npm test

      - name: Prepare arm64 runtime
        run: macos/scripts/prepare-runtime.sh

      - name: Verify lossless PCM round trip
        env:
          STEM_PACKAGER_FFMPEG: macos/Runtime/macos-arm64/ffmpeg
          STEM_PACKAGER_FFPROBE: macos/Runtime/macos-arm64/ffprobe
        run: node --test test/lossless-roundtrip.test.mjs

      - name: Build and verify app bundle
        run: |
          macos/scripts/build-app.sh
          APP="macos/build/Traktor Stem Packager.app"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/TraktorStemPackager" | grep arm64
          file "$APP/Contents/Resources/Runtime/node" | grep arm64
          file "$APP/Contents/Resources/Runtime/ffmpeg" | grep arm64
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "$PACKAGE_VERSION"
          zsh -n "macos/installer/Install Traktor Stem Packager.command"

  publish-release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download verified installer artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifacts

      - name: Verify installer checksum
        working-directory: release-artifacts
        run: sha256sum --check *.sha256

      - name: Publish installer, checksum, and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v$PACKAGE_VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving the published release unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            release-artifacts/*.zip \
            release-artifacts/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "Traktor Stem Packager $PACKAGE_VERSION" \
            --notes-file RELEASE_BODY.md
