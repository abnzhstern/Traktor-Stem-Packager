name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experimental/native-alac-linked
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run engine tests
        run: |
          npm ci
          npm test

      - name: Prepare private arm64 runtime
        run: macos/scripts/prepare-runtime.sh

      - name: Verify lossless PCM round trip
        env:
          STEM_PACKAGER_FFMPEG: macos/Runtime/macos-arm64/ffmpeg
          STEM_PACKAGER_FFPROBE: macos/Runtime/macos-arm64/ffprobe
        run: node --test test/lossless-roundtrip.test.mjs

      - name: Verify Apple AAC 320 CBR encoder
        run: |
          FFMPEG="macos/Runtime/macos-arm64/ffmpeg"
          FFPROBE="macos/Runtime/macos-arm64/ffprobe"
          "$FFMPEG" -hide_banner -loglevel error -y \
            -f lavfi -i "anullsrc=r=44100:cl=stereo" -t 2 \
            -c:a aac_at -aac_at_mode cbr -b:a 320k /tmp/aac-320-cbr.m4a
          test "$("$FFPROBE" -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/aac-320-cbr.m4a)" = "aac"

      - name: Build self-contained app
        run: macos/scripts/build-app.sh

      - name: Verify bundle and installer
        run: |
          APP="macos/build/Traktor Stem Packager.app"
          INSTALLER="macos/installer/Install Traktor Stem Packager.command"
          test -x "$APP/Contents/MacOS/TraktorStemPackager"
          test -x "$APP/Contents/Resources/Runtime/node"
          test -x "$APP/Contents/Resources/Runtime/ffmpeg"
          test -x "$APP/Contents/Resources/Runtime/ffprobe"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          test "$(plutil -extract CFBundleDisplayName raw "$APP/Contents/Info.plist")" = "Traktor Stem Packager"
          test "$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")" = "AppIcon"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "0.6.0-beta.11"
          grep -F 'Text("v0.6.0-beta.11")' macos/Sources/TraktorStemPackager/ContentView.swift
          grep -F 'case .nativeLossless: "Lossless Traktor Installation"' macos/Sources/TraktorStemPackager/AudioRole.swift
          codesign --verify --deep --strict "$APP"
          file "$APP/Contents/MacOS/TraktorStemPackager" | grep arm64
          file "$APP/Contents/Resources/Runtime/node" | grep arm64
          file "$APP/Contents/Resources/Runtime/ffmpeg" | grep arm64
          test -x "$INSTALLER"
          zsh -n "$INSTALLER"

      - name: Package application with installer
        run: |
          DIST="Traktor Stem Packager Installer"
          mkdir -p "$DIST"
          ditto "macos/build/Traktor Stem Packager.app" "$DIST/Traktor Stem Packager.app"
          cp "macos/installer/Install Traktor Stem Packager.command" "$DIST/"
          cp "macos/installer/README.txt" "$DIST/"
          cp "macos/installer/LOSSLESS-TEST-NOTES.txt" "$DIST/"
          chmod +x "$DIST/Install Traktor Stem Packager.command"
          ditto -c -k --sequesterRsrc --keepParent "$DIST" "Traktor-Stem-Packager-0.6.0-beta.11-dual-mode-test.zip"
          shasum -a 256 "Traktor-Stem-Packager-0.6.0-beta.11-dual-mode-test.zip" > "Traktor-Stem-Packager-0.6.0-beta.11-dual-mode-test.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Traktor-Stem-Packager-0.6.0-beta.11-dual-mode-test
          path: |
            Traktor-Stem-Packager-0.6.0-beta.11-dual-mode-test.zip
            Traktor-Stem-Packager-0.6.0-beta.11-dual-mode-test.zip.sha256
          if-no-files-found: error
          retention-days: 14
